<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Startup Stack — Startup Credits & GPU Treasury</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Parkinsans:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       MINIMAL EDITORIAL TOKENS & TYPOGRAPHY SYSTEM
       Strict 3-Font Hierarchy (No Default System Fonts):
       1. Parkinsans: Display, Brand & Numbers
       2. Plus Jakarta Sans: Interface, UI Controls & Body Copy
       3. Geist Mono: Citations, Codes, URLs & Technical Metadata
       ========================================================================== */
    :root {
      --font-display: 'Parkinsans', sans-serif;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'Geist Mono', monospace;

      /* Calm Light Paper Palette */
      --bg-page: #F7F7F8;
      --bg-shell: #FFFFFF;
      --bg-card: #FFFFFF;
      --bg-card-hover: #FBFBFC;
      --bg-card-active: #F8F9FA;
      --bg-subtle: #F8F9FA;
      --bg-tag: #F1F3F5;
      --bg-pill: #F3F4F6;
      --bg-logo: #F8FAFC;

      /* Borders */
      --border-subtle: #EBECEF;
      --border-hover: #CBD5E1;
      --border-active: #0F172A;
      --border-card: #EBECEF;

      /* Typography Ink */
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --text-faint: #94A3B8;
      --text-reading: #2D3748;

      /* Accents */
      --accent-green: #059669;
      --accent-green-subtle: #F0FDF4;
      --accent-green-text: #065F46;
      --accent-green-pill: #DCFCE7;
      --accent-blue: #2563EB;
      --accent-red: #E11D48;
      --accent-red-subtle: #FFF1F2;
      --accent-red-text: #9F1239;

      /* Elevation */
      --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-card-hover: 0 6px 16px -2px rgba(0, 0, 0, 0.05);
      --shadow-card-active: 0 0 0 1.5px var(--border-active), 0 4px 14px rgba(0, 0, 0, 0.06);
      --shadow-shell: 0 12px 36px -8px rgba(15, 23, 42, 0.05), 0 0 0 1px rgba(15, 23, 42, 0.03);
      --shadow-shell-mobile: 0 20px 40px -10px rgba(15, 23, 42, 0.15), 0 0 0 8px #E2E8F0;

      --radius-tile: 16px;
      --radius-panel: 20px;
    }

    /* Dark Mode Palette */
    [data-theme="dark"] {
      --bg-page: #0B0D0F;
      --bg-shell: #121519;
      --bg-card: #171B21;
      --bg-card-hover: #1D222A;
      --bg-card-active: #212730;
      --bg-subtle: #171B21;
      --bg-tag: #1F242C;
      --bg-pill: #1C2128;
      --bg-logo: #14171C;

      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.20);
      --border-active: #FFFFFF;
      --border-card: rgba(255, 255, 255, 0.08);

      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --text-faint: #475569;
      --text-reading: #CBD5E1;

      --accent-green: #10B981;
      --accent-green-subtle: rgba(16, 185, 129, 0.12);
      --accent-green-text: #6EE7B7;
      --accent-green-pill: rgba(52, 211, 153, 0.15);
      --accent-blue: #3B82F6;
      --accent-red: #F43F5E;
      --accent-red-subtle: rgba(244, 63, 94, 0.12);
      --accent-red-text: #FDA4AF;

      --shadow-subtle: none;
      --shadow-card-hover: 0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-card-active: 0 0 0 1.5px #FFFFFF, 0 8px 24px rgba(0, 0, 0, 0.6);
      --shadow-shell: 0 24px 60px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --shadow-shell-mobile: 0 25px 60px -15px rgba(0, 0, 0, 0.95), 0 0 0 8px #1A1F26;
    }

    [data-theme="dark"] .logo-backdrop {
      fill: #1A1F26 !important;
      stroke: rgba(255, 255, 255, 0.12) !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px 16px;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Top Control Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      width: 100%;
      max-width: 980px;
      margin-bottom: 12px;
      padding: 0 4px;
      gap: 8px;
    }

    .theme-pill {
      display: inline-flex;
      align-items: center;
      background: var(--bg-shell);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 3px 4px;
      box-shadow: var(--shadow-subtle);
    }

    .theme-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .theme-btn:hover {
      color: var(--text-primary);
    }

    .theme-btn.active {
      background: var(--bg-subtle);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .viewport-toggle {
      background: var(--bg-shell);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-subtle);
      transition: all 0.15s ease;
    }

    .viewport-toggle:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Master Clean Shell */
    .app-shell {
      width: 100%;
      max-width: 980px;
      background-color: var(--bg-shell);
      border-radius: var(--radius-panel);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-shell);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.2s ease, border-color 0.2s ease;
    }

    .app-shell.mobile-mode {
      max-width: 410px;
      border-radius: 32px;
      box-shadow: var(--shadow-shell-mobile);
    }

    /* Minimalist Header */
    .app-header {
      padding: 28px 32px 20px 32px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      user-select: none;
    }

    .brand-logo-img {
      height: 32px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    body.dark-mode .brand-logo-img.logo-light {
      display: none;
    }

    body.dark-mode .brand-logo-img.logo-dark {
      display: block;
    }

    body:not(.dark-mode) .brand-logo-img.logo-dark {
      display: none;
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text-primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1;
    }

    .wordmark-ai {
      color: var(--text-primary);
      font-weight: 800;
    }

    .wordmark-name {
      color: var(--text-primary);
      font-weight: 700;
    }

    .brand-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      background: var(--bg-subtle);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
    }

    .brand-subtitle {
      font-family: var(--font-ui);
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      letter-spacing: -0.1px;
    }

    /* Carousel Track Section */
    .carousel-section {
      padding: 24px 32px 20px 32px;
      position: relative;
    }

    .carousel-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .carousel-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .carousel-nav {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 4px 2px 10px 2px;
      scrollbar-width: none;
    }

    .carousel-track::-webkit-scrollbar {
      display: none;
    }

    /* Strict Square Tile (196x196px, 1:1 ratio) */
    .square-tile {
      width: 196px;
      min-width: 196px;
      height: 196px;
      aspect-ratio: 1 / 1;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-tile);
      padding: 18px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-subtle);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      position: relative;
    }

    .square-tile:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
    }

    .square-tile.active {
      background: var(--bg-card-active);
      border-color: var(--border-active);
      box-shadow: var(--shadow-card-active);
    }

    .tile-logo-box {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
      transition: transform 0.2s ease;
    }

    .square-tile:hover .tile-logo-box {
      transform: scale(1.05);
    }

    .tile-name {
      font-family: var(--font-ui);
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.25;
      letter-spacing: -0.2px;
      margin-top: 4px;
    }

    .tile-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      width: 100%;
    }

    .tile-amount {
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
    }

    .tile-dq-pill {
      font-family: var(--font-mono);
      font-size: 9.5px;
      font-weight: 600;
      color: #991B1B;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 2px 7px;
      border-radius: 999px;
      display: inline-block;
      line-height: 1.3;
      white-space: nowrap;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    body.dark-mode .tile-dq-pill {
      color: #FCA5A5;
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* Reading & Program Detail View */
    .detail-view {
      padding: 28px 32px 36px 32px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .detail-identity {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .detail-logo {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .audit-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .audit-tag.verified {
      color: var(--accent-green);
      background: rgba(5, 150, 105, 0.08);
      border-color: rgba(5, 150, 105, 0.2);
    }

    .audit-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    .detail-titles h2 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .detail-titles p {
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-apply {
      background: var(--text-primary);
      color: var(--bg-shell);
      font-family: var(--font-ui);
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.15s ease;
    }

    .btn-apply:hover {
      opacity: 0.88;
    }

    .btn-copy {
      background: none;
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: var(--font-ui);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-copy:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Minimal Key Facts Strip (3 quiet metrics) */
    .facts-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border-subtle);
    }

    @media (max-width: 600px) {
      .facts-strip {
        grid-template-columns: 1fr;
        gap: 12px;
      }
    }

    .fact-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .fact-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .fact-val {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
    }

    .fact-sub {
      font-family: var(--font-ui);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* 3-Tab Segmented Control */
    .tab-strip {
      display: flex;
      gap: 6px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tab-strip::-webkit-scrollbar {
      display: none;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px 8px 32px 8px;
      }
      .app-header {
        padding: 20px 16px 16px 16px;
      }
      .carousel-section {
        padding: 18px 16px 16px 16px;
      }
      .detail-view {
        padding: 20px 16px 28px 16px;
      }
      .viewport-toggle {
        display: none;
      }
      .detail-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .detail-actions {
        width: 100%;
        justify-content: flex-start;
      }
    }

    .tab-item {
      background: none;
      border: none;
      font-family: var(--font-ui);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .tab-item:hover {
      color: var(--text-primary);
      background: var(--bg-subtle);
    }

    .tab-item.active {
      color: var(--text-primary);
      background: var(--bg-subtle);
      font-weight: 600;
    }

    /* Tab Content Area */
    .tab-body {
      padding-top: 22px;
      min-height: 280px;
    }

    /* Tab 1: Deep Research Essay */
    .essay-view {
      max-width: 820px;
    }

    .essay-text {
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-reading);
    }

    .essay-text p {
      margin-bottom: 20px;
    }

    .services-block {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    .product-breakdown-section {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .breakdown-title {
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .product-item-card {
      background: var(--bg-card-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease;
    }

    .product-item-card:hover {
      border-color: var(--border-hover);
    }

    .product-item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
    }

    .product-name {
      font-family: var(--font-ui);
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .product-role {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .product-what {
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .product-why {
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .perks-section {
      margin-top: 22px;
      background: rgba(5, 150, 105, 0.04);
      border: 1px solid rgba(5, 150, 105, 0.2);
      border-radius: 10px;
      padding: 14px 18px;
    }

    .perks-title {
      font-family: var(--font-ui);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--accent-green);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .perks-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .perk-bullet {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-family: var(--font-ui);
      font-size: 12.5px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .perk-icon {
      color: var(--accent-green);
      font-size: 12px;
      line-height: 1.5;
    }

    .finops-warning-box {
      margin-top: 18px;
      background: rgba(239, 68, 68, 0.04);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 10px;
      padding: 14px 18px;
      font-family: var(--font-ui);
      font-size: 12px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    .finops-warning-box .warn-label {
      font-weight: 700;
      color: #DC2626;
      display: block;

its, 1 yr Business Support ($5k value), architectural guidance", "brandColor": "#FF9900", "essay": "The AWS Activate Portfolio Track represents one of the most structurally impactful non-dilutive capital instruments available to an early-stage institutional AI venture studio. Structurally, the program provides up to $100,000 in AWS Promotional Credits with a standard 12-to-24 month validity window, accompanied by up to $10,000 in AWS Business Support credits that afford direct 24/7 access to Senior Cloud Support Engineers and Trusted Advisor infrastructure audits. Compute allocation spans the entirety of AWS's accelerated compute infrastructure, including NVIDIA A10G and H100-backed EC2 instances (G5, G6, P4de, and P5 families), fully managed container execution via Amazon ECS/EKS, and serverless compute via AWS Lambda. Crucially for an AI-native balance sheet, Activate credits cover the full cost of managed foundation model inference on Amazon Bedrock\u2014unlocking premier frontier models such as Anthropic Claude 3.5 Sonnet, Mistral Large, and Meta Llama 3\u2014alongside proprietary fine-tuning pipelines hosted on Amazon SageMaker and developer tooling such as Amazon Q Developer and AWS CodePipeline.\n\nFrom an operational standpoint, securing a $100,000 allocation alters the operational efficiency curve for the startup and our core SaaS assets, particularly the product. the product's synthetic customer research platform relies on complex, asynchronous multi-agent simulations, web scraping pipelines, and high-context retrieval-augmented generation (RAG) loops. By anchoring these workloads to Amazon Bedrock for frontier inference, OpenSearch Serverless for high-dimension vector indexing, and Amazon S3 Express One Zone for ultra-low-latency artifact storage, the startup eliminates the primary operating cash drain associated with generative AI development. What would normally register as an unsustainable $7,000 to $12,000 monthly inference and compute burn rate is entirely absorbed by hyperscaler capital. This allows our engineering cycles to aggressively scale synthetic market simulations and multi-agent debate protocols with zero burn against our cash reserves.\n\nFrom Vespa's financial perspective, liquidity management requires defensive engineering against credit degradation and post-grant operational cliffing. While Activate credits provide an effective burn reduction of up to $8,333 per month across a 12-month horizon, unmonitored architectural design can lead to rapid capital leakage. Specifically, inter-region Data Transfer Out (egress) and unattached Elastic Block Store (EBS) volumes represent unoptimized overhead that rapidly depletes allocations without driving enterprise value. the startup mitigates this by enforcing strict VPC endpoints, single-region data co-location, and automated S3 lifecycle transitions to Glacier Instant Retrieval. Furthermore, to guarantee long-term survivability after credit exhaustion, we model production workloads for transition into 1-year and 3-year Compute Savings Plans and Reserved Instances, dropping ongoing GPU and container compute expenses by up to 72% and preserving an 80%+ gross margin as the product transitions to self-sustaining recurring enterprise revenue.", "executiveSummary": "The AWS Activate Portfolio allocation provides the startup and the product with up to $100,000 in non-dilutive compute capital and $10,000 in enterprise support, completely insulating our operating cash balance from heavy generative AI inference and GPU training costs. Securing this grant optimizes runway extension by absorbing up to $8,333 per month in cloud spend while enabling production-grade RAG and multi-agent modeling across Amazon Bedrock and SageMaker.", "requirements": ["Delaware C-Corp legal entity in verified good standing (the company) with matching EIN and corporate documentation.", "Active, authenticated AWS Root Account in good standing with a valid corporate credit card on file and co ck", "role": "Managed Generative AI & Foundational Models", "whatItIs": "A unified API hub to run state-of-the-art AI models (like Anthropic Claude, Meta Llama, and Mistral) without managing GPU infrastructure.", "founderValue": "Run your GenAI features and RAG pipelines on AWS credits rather than burning cash on out-of-pocket OpenAI API bills. It keeps your proprietary data safely inside your private AWS boundary."}, {"product": "AWS Fargate (via ECS)", "role": "Serverless Container Hosting", "whatItIs": "A compute engine that executes your Docker containers automatically without making you provision, patch, or manage underlying EC2 servers.", "founderValue": "Ship production web apps and APIs in minutes without the operational nightmare of Kubernetes. You pay only for the exact CPU and memory consumed while code runs."}, {"product": "Amazon Aurora Serverless v2", "role": "Auto-Scaling Relational Database", "whatItIs": "An enterprise-grade PostgreSQL/MySQL database that scales computing capacity up or down automatically in fractions of a second based on traffic.", "founderValue": "Survives massive product launch spikes without crashing, then instantly dials down compute to near-zero during off-hours to preserve credits. Replaces the need for a dedicated database administrator."}, {"product": "Amazon Cognito", "role": "User Authentication & Directory", "whatItIs": "A plug-and-play user identity service that handles sign-up, sign-in, MFA, and access control for web and mobile apps.", "founderValue": "Saves up to $1,000+ monthly by avoiding third-party authentication SaaS platforms like Auth0. It handles millions of users, social logins, and SAML SSO directly on your credit balance."}, {"product": "Amazon OpenSearch Service", "role": "Managed Search & Vector Database", "whatItIs": "A fully managed search engine designed for ultra-fast text search, application log analytics, and vector embeddings for AI.", "founderValue": "Powers semantic search and retrieval-augmented
